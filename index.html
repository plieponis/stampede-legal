<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stampede · The daily steps competition</title>
<meta name="description" content="Stampede is a daily steps competition for iPhone. A new competition every day against people who walk about as much as you. Finish on top to rank up.">
<meta property="og:title" content="Stampede · The daily steps competition">
<meta property="og:description" content="A new competition every day against people who walk about as much as you. Finish on top to rank up.">
<meta property="og:image" content="https://stampedesteps.com/assets/icon.png">
<meta name="theme-color" content="#FFF4DA">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --yellow: #FFF4DA; --brown: #41371E; --text: #1A1A1A; --muted: #5E5E5E; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--yellow); color: var(--text); font: 17px/1.55 Inter, -apple-system, system-ui, sans-serif; }
  img { display: block; max-width: 100%; }
  main { flex: 1; display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; max-width: 1080px; width: 100%; margin: 0 auto; padding: 56px 20px; }

  .logo { width: clamp(120px, 16vw, 170px); margin-bottom: 4px; }
  /* Matches the app's Welcome screen: Bowlby One in brown, letter spacing 1.44/48,
     a white outline drawn as 24 copies in a circle 4/48 em out, and a soft drop shadow. */
  .title {
    margin: 0; color: var(--brown);
    font: clamp(54px, 8.5vw, 92px)/1.15 "Bowlby One", sans-serif; letter-spacing: .03em;
    text-shadow: 0.0833em 0.0000em 0 #fff, 0.0805em 0.0216em 0 #fff, 0.0722em 0.0417em 0 #fff, 0.0589em 0.0589em 0 #fff, 0.0417em 0.0722em 0 #fff, 0.0216em 0.0805em 0 #fff, 0.0000em 0.0833em 0 #fff, -0.0216em 0.0805em 0 #fff, -0.0417em 0.0722em 0 #fff, -0.0589em 0.0589em 0 #fff, -0.0722em 0.0417em 0 #fff, -0.0805em 0.0216em 0 #fff, -0.0833em 0.0000em 0 #fff, -0.0805em -0.0216em 0 #fff, -0.0722em -0.0417em 0 #fff, -0.0589em -0.0589em 0 #fff, -0.0417em -0.0722em 0 #fff, -0.0216em -0.0805em 0 #fff, -0.0000em -0.0833em 0 #fff, 0.0216em -0.0805em 0 #fff, 0.0417em -0.0722em 0 #fff, 0.0589em -0.0589em 0 #fff, 0.0722em -0.0417em 0 #fff, 0.0805em -0.0216em 0 #fff;
    filter: drop-shadow(0 .083em .04em rgba(0, 0, 0, .25));
  }
  .tagline { font-size: clamp(12px, 1.5vw, 15px); letter-spacing: .22em; text-transform: uppercase; color: var(--brown); margin: 6px 0 28px; }
  .lede { font-size: 21px; color: var(--muted); max-width: 30ch; margin: 0 0 32px; }
  .cta { display: inline-flex; align-items: center; gap: 12px; background: var(--text); color: #fff; border-radius: 14px; padding: 12px 20px; }
  .cta svg { width: 22px; height: 22px; fill: currentColor; }
  .cta small { display: block; font-weight: 500; font-size: 12px; opacity: .75; line-height: 1.2; }
  .cta span { display: block; font-weight: 700; font-size: 18px; line-height: 1.2; }
  .note { color: var(--muted); font-size: 14px; margin: 14px 0 0; }

  .phone { width: min(320px, 78vw); margin: 0 auto; border-radius: 46px; border: 10px solid #151515; background: #151515; box-shadow: 0 30px 60px rgba(65,55,30,.25); overflow: hidden; transform: rotate(3deg); }
  .phone img { width: 100%; border-radius: 36px; }

  footer { text-align: center; padding: 0 20px 28px; font-size: 14px; color: var(--muted); }
  footer a { color: var(--brown); font-weight: 700; text-decoration: none; margin: 0 10px; white-space: nowrap; }
  footer p { margin: 10px 0 0; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; text-align: center; padding-top: 40px; gap: 40px; }
    .logo { margin-left: auto; margin-right: auto; }
    .lede { margin-left: auto; margin-right: auto; }
    .phone { transform: none; }
  }
</style>
</head>
<body>
<main>
  <div>
    <img class="logo" src="assets/logo.png" alt="">
    <h1 class="title">STAMPEDE</h1>
    <p class="tagline">The daily steps competition</p>
    <p class="lede">A new competition every day against people who walk about as much as you. Finish on top to rank up.</p>
    <div class="cta" role="img" aria-label="Coming soon to the App Store">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.6c-.03-2.6 2.13-3.86 2.22-3.92-1.21-1.77-3.1-2.01-3.77-2.04-1.6-.16-3.13.95-3.94.95-.82 0-2.07-.93-3.4-.9-1.75.03-3.36 1.02-4.26 2.58-1.82 3.15-.47 7.81 1.3 10.36.87 1.25 1.9 2.65 3.25 2.6 1.31-.05 1.8-.84 3.38-.84 1.57 0 2.02.84 3.4.81 1.4-.02 2.29-1.27 3.15-2.52.99-1.45 1.4-2.85 1.42-2.93-.03-.01-2.72-1.04-2.75-4.15zM13.8 4.96c.72-.87 1.2-2.08 1.07-3.29-1.03.04-2.29.69-3.03 1.56-.67.77-1.25 2-1.09 3.18 1.15.09 2.33-.58 3.05-1.45z"/></svg>
      <div><small>Coming soon to the</small><span>App Store</span></div>
    </div>
    <p class="note">For iPhone. Free, with nothing to buy.</p>
  </div>
  <div class="phone"><img src="assets/shot-fox.png" alt="The Stampede leaderboard: ten players ranked by steps, with promotion and demotion zones"></div>
</main>
<footer>
  <a href="/privacy/">Privacy Policy</a><a href="/terms/">Terms of Use</a><a href="mailto:support@stampedesteps.com">Contact</a>
  <p>© 2026 Seven Eight Ventures LLC</p>
</footer>
</body>
</html>
