<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stampede · Stampede</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#FFF4DA; --card:#FFFFFF; --text:#1A1A1A; --muted:#5E5E5E; --accent:#4E7F43; --line:#EDE3CA; }
@media (prefers-color-scheme: dark) { :root { --bg:#1B1913; --card:#24211A; --text:#F2EDE1; --muted:#B9B2A2; --accent:#8CC07E; --line:#3A3528; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 Inter, -apple-system, system-ui, sans-serif; }
main { max-width:720px; margin:0 auto; padding:40px 16px 64px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 24px; }
h1 { font-size:32px; line-height:1.2; margin:0 0 8px; }
h2 { font-size:21px; margin:32px 0 8px; }
p, li { color:var(--muted); margin:0 0 12px; }
strong { color:var(--text); }
a { color:var(--accent); }
ul { padding-left:22px; margin:0 0 12px; }
.brand { font-weight:800; letter-spacing:.08em; color:var(--accent); margin-bottom:16px; font-size:14px; }
nav a { margin-right:16px; }
</style></head>
